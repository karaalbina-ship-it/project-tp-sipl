name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tag must match package version
        run: |
          VERSION=$(python -c "import formlang; print(formlang.__version__)")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "тег $GITHUB_REF_NAME ≠ версія v$VERSION"; exit 1; }
      - run: pytest -q
      - run: python -m build
      - name: Release notes from README
        run: |
          python - <<'PY'
          import os, re
          ver = os.environ["GITHUB_REF_NAME"].lstrip("v")
          text = open("README.md", encoding="utf-8").read()
          m = re.search(rf"^### \[{re.escape(ver)}\].*?$(.*?)(?=^##+ |\Z)", text, re.S | re.M)
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() if m else f"Release {ver}")
          PY
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: dist/*
