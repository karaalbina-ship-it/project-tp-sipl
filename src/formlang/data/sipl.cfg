<програма> ::= "begin" <оператор> "end"
<оператор> ::= <змінна> ":=" <вираз> | <оператор> ";" <оператор> | "if" <умова> "then" <оператор> "else" <оператор> | "while" <умова> "do" <оператор> | "begin" <оператор> "end" | "skip"
<вираз>    ::= <число> | <змінна> | <вираз> "+" <вираз> | <вираз> "-" <вираз> | <вираз> "*" <вираз> | "(" <вираз> ")"
<умова>    ::= <вираз> "=" <вираз> | <вираз> ">" <вираз> | <умова> "∨" <умова> | "¬" <умова> | "(" <умова> ")"
<змінна>   ::= %ident
<число>    ::= %number
